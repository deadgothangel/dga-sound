<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGA SOUND</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      background: #0d0b12;
      background: radial-gradient(circle at 50% 20%, #2e1065 0%, #0d0b12 70%);
      color: #ffffff;
      min-height: 100vh;
      padding: 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }
    .logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
    nav a { color: #a1a1aa; text-decoration: none; margin-left: 25px; font-size: 14px; transition: 0.3s; }
    nav a.active, nav a:hover { color: #fff; }
    .disabled { opacity: 0.4; cursor: not-allowed; }
    
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .score-title { font-size: 28px; margin-bottom: 20px; font-weight: 700; }
    .slider-group { margin-bottom: 20px; }
    .slider-group label { display: block; font-size: 14px; color: #d4d4d8; margin-bottom: 8px; }
    input[type=range] { width: 100%; accent-color: #a855f7; }
    .score-display { text-align: right; font-size: 48px; font-weight: 900; color: #a855f7; margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DGA SOUND</div>
    <nav>
      <a href="#" class="active">РЕЛИЗЫ</a>
      <a href="#">ДЕМО</a>
      <a href="#">ЧАРТ</a>
      <a href="#" class="disabled">АЛЬБОМЫ 🔒 (COMING SOON)</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <div class="score-title">Оценка трека</div>
      
      <div class="slider-group">
        <label>Рифмы / Образы</label>
        <input type="range" min="0" max="10" step="0.5" value="5">
      </div>

      <div class="slider-group">
        <label>Структура / Ритмика</label>
        <input type="range" min="0" max="10" step="0.5" value="5">
      </div>

      <div class="score-display">50.0 / 100</div>
    </div>
  </main>

</body>
</html>
